plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def packageJson = new groovy.json.JsonSlurper().parse(file('../package.json'))
version = "${packageJson.version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroupAndSubgroups('com.geckolib')
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"werewolf" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "werewolf-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
}

// Models, textures, animations, lang, loot, recipes and species data are
// generated from the shared specs by `npm run build` (tools/build.mjs).
sourceSets.main.resources.srcDir 'src/generated/resources'

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("../LICENSE") {
		rename { "${it}_werewolves" }
	}
}
